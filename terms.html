<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to Terms of Use</title>
  <meta http-equiv="refresh" content="0; url=/terms/" />
  <link rel="canonical" href="/terms/" />
  <link rel="icon" href="/assets/icons/favicon.ico?v=13">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      color:#f0eef2;
      font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1000px 520px at 50% 0%, rgba(216,30,30,.20), transparent 58%),
        linear-gradient(180deg, #16080d 0%, #09090b 34%, #050506 100%);
      position:relative;
    }
    body::before{
      content:"";
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:min(46vh, 420px);
      pointer-events:none;
      background-image:url("/assets/logo/trustware-logo.png");
      background-repeat:no-repeat;
      background-position:center 24px;
      background-size:min(36vw, 380px) auto;
      opacity:.07;
      filter:saturate(.9) brightness(.86);
      z-index:0;
    }
    p{position:relative;z-index:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);padding:14px 18px;border-radius:12px}
    a{color:#f2cf45}
  </style>
  <script>window.location.replace("/terms/");</script>
</head>
<body>
  <p>Redirecting to <a href="/terms/">/terms/</a>.</p>
</body>
</html>
